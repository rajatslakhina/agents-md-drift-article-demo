<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:840px;background:#0f1419;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#e8edf2;position:relative;overflow:hidden}
.grid{position:absolute;right:80px;top:230px;display:grid;grid-template-columns:repeat(19,28px);gap:7px}
.c{width:28px;height:28px;border-radius:5px;background:#2b3540}
.c.ch{background:#f59e0b}.c.x{background:#ef4444}
.l{position:absolute;left:90px;top:200px;width:720px}
.kick{font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#f59e0b;font-weight:700}
.big{font-size:150px;font-weight:800;line-height:1;margin-top:26px;letter-spacing:-.03em}
.big span{color:#5b6b7b}
.cap{font-size:34px;line-height:1.3;margin-top:28px;color:#c9d3dc}
.file{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:26px;color:#9fb0c0;margin-top:40px}
.leg{position:absolute;left:862px;top:580px;width:660px;font-size:22px;color:#9fb0c0;display:flex;flex-wrap:wrap;gap:12px 28px}
.leg i{display:inline-block;width:16px;height:16px;border-radius:3px;margin-right:8px;vertical-align:-2px}
</style></head><body>
<div class="l">
<div class="kick">AGENTS.md is a future lie</div>
<div class="big">455<span>/664</span></div>
<div class="cap">paths named in the agent instructions of 18 public Swift repos changed after the line naming them was last edited.</div>
<div class="file">AGENTS.md · CLAUDE.md · 37 files · 779 paths</div>
</div>
<div class="grid" id="g"></div>
<div class="leg"><span><i style="background:#f59e0b"></i>changed since written</span><span><i style="background:#2b3540"></i>unchanged</span><span style="color:#6b7b8b">1 square = 4 paths</span><span><i style="background:#ef4444"></i>gone (3 paths)</span></div>
<script>
// 664 live paths at 1 cell per 4 paths = 166 cells: 114 changed (455/4), 52 unchanged; plus 1 cell for the 3 removed paths.
const g=document.getElementById('g');const changed=Math.round(455/4), total=Math.round(664/4);
for(let i=0;i<total+1;i++){const d=document.createElement('div');d.className='c'+(i<changed?' ch':(i==total?' x':''));g.appendChild(d)}
</script></body></html>
