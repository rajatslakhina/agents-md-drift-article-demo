name: Field audit

# Re-runs the 18-repo audit at the pinned commits and commits the raw output.
# The results are deterministic: same commits, same git history, same numbers.
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tools/**'
      - 'Scripts/field_audit.sh'
      - 'Scripts/summarize_field_audit.py'
  workflow_dispatch:

concurrency:
  group: field-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run the audit
        run: bash Scripts/field_audit.sh
      - name: Commit raw results if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/field-audit
          if ! git diff --cached --quiet; then
            git commit -m "Field audit output [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
